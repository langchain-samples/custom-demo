[project]
name = "custom-demo"
version = "0.1.0"
description = "Custom demo platform: one Deep Agent, one SPA, a per-customer assistant"
readme = "README.md"
# Upper bound, not just a floor: 3.13 is the newest Python the LangGraph deployment
# base image builds (langgraph.json pins python_version "3.13"), so a 3.14 interpreter
# has to fail resolution here rather than quietly pass CI and break the deploy build.
requires-python = ">=3.13,<3.14"
dependencies = [
    # 0.7: the callable BackendFactory is gone; per-run backend selection is now a
    # concrete BackendProtocol that reads runtime context internally (get_runtime),
    # see agent.py DynamicBackend. 0.7 also makes TodoListMiddleware opt-in (we drop
    # our exclusion hack) and is required by langchain-quickjs>=0.3 (below).
    "deepagents>=0.7,<0.8",
    "langchain[mcp]>=1.4.0",
    "langchain-core>=1.4.0",
    "langchain-anthropic>=1.4.3",
    # Azure OpenAI / OpenAI-compatible deployments (AGENT_MODEL=azure_openai:<deployment>).
    "langchain-openai>=0.3",
    "langgraph>=1.2.1",
    # [sandbox] extra: the SandboxClient behind the agent's code-execution VM
    # (deepagents LangSmithSandbox backend).
    "langsmith[sandbox]>=0.10",
    # auth.py (loaded by the deployment) uses langgraph_sdk.Auth
    "langgraph-sdk>=0.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    # the /feedback route mounted on the deployment (http.app)
    "starlette>=0.37",
    # Dynamic subagents: the QuickJS code-interpreter (CodeInterpreterMiddleware).
    # 0.3.x requires deepagents>=0.7 and makes `task()`-from-code dispatches stream as
    # named, namespaced delegated subagents (the point of the 0.7 upgrade — so the SPA
    # panel can see eval-launched subagents). Gated by DYNAMIC_SUBAGENTS (default
    # off); the native quickjs-rs dep ships cp313 wheels for the deploy image.
    "langchain-quickjs>=0.3,<0.4",
    # Real web search behind the `web_search` tool (tools/web_search.py). Without
    # TAVILY_API_KEY the tool returns an error rather than inventing results.
    "langchain-tavily>=0.2.18,<0.3",
]

[dependency-groups]
dev = [
    # Run the deployment locally (Agent Server) + create assistants
    "langgraph-cli[inmem]>=0.4",
    "pytest>=8.0",
    # LangSmith pytest plugin extras (rich) for `pytest --langsmith-output`
    "langsmith[pytest]>=0.10",
    # Lint/format + type-check
    "ruff>=0.14",
    "ty>=0.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["custom_demo"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# pycodestyle(E/W), pyflakes(F), isort(I), pyupgrade(UP), bugbear(B),
# comprehensions(C4), pydocstyle(D — docstrings required + formatted).
# Two single rules rather than their whole groups (PL and TID would each light up
# hundreds of unrelated findings): PLC0415 keeps imports at the top of the file, and
# TID252 keeps them absolute. Both are waivable with an inline `# noqa` + a reason —
# a real import cycle, or a dependency that must not be required at import time.
select = ["E", "W", "F", "I", "UP", "B", "C4", "D", "PLC0415", "TID252", "BLE001", "RUF100"]
# Long lines are common in the prompt/data string literals; the formatter owns wrapping.
ignore = ["E501"]

[tool.ruff.lint.flake8-tidy-imports]
# "all", not the default "parents": `from .client import ...` is as unhelpful as
# `from ..config import ...` when the reader has to know which package they are in.
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
# Google style — picks the compatible D subset (no conflicting D203/D212/etc.).
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: assert-heavy patterns + don't require docstrings on every test function.
# Both test locations, not just the one that existed when this was written: `evals/`
# had no tests at all until one of its pure helpers turned out to be broken.
"custom_demo/tests/*" = ["B011", "D100", "D101", "D102", "D103", "D104"]
"evals/test_*.py" = ["B011", "D100", "D101", "D102", "D103", "D104"]

[tool.ty.environment]
python-version = "3.13"
