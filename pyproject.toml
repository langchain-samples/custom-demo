[project]
name = "custom-demo"
version = "0.1.0"
description = "Dashboard Agent — Deep Agent with dynamic dashboard visualizations"
readme = "README.md"
# Max Python the LangGraph deployment base image supports (3.14 can't deploy yet).
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.6.3",
    "langchain>=1.3.1",
    "langchain-core>=1.4.0",
    "langchain-anthropic>=1.4.3",
    "langgraph>=1.2.1",
    "langsmith>=0.8.3",
    # auth.py (loaded by the deployment) uses langgraph_sdk.Auth
    "langgraph-sdk>=0.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    # the /feedback route mounted on the deployment (http.app)
    "starlette>=0.37",
]

[dependency-groups]
dev = [
    # Run the deployment locally (Agent Server) + create assistants
    "langgraph-cli[inmem]>=0.4",
    "pytest>=8.0",
    # Lint/format + type-check
    "ruff>=0.14",
    "ty>=0.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dashboard_agent"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# pycodestyle(E/W), pyflakes(F), isort(I), pyupgrade(UP), bugbear(B),
# comprehensions(C4), pydocstyle(D — docstrings required + formatted).
select = ["E", "W", "F", "I", "UP", "B", "C4", "D"]
# Long lines are common in the prompt/data string literals; the formatter owns wrapping.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
# Google style — picks the compatible D subset (no conflicting D203/D212/etc.).
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: assert-heavy patterns + don't require docstrings on every test function.
"dashboard_agent/tests/*" = ["B011", "D100", "D101", "D102", "D103", "D104"]

[tool.ty.environment]
python-version = "3.13"


[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"

# Show type mismatches as warnings (yellow) instead of errors (red). Values:
# "error" | "warn" | "ignore". Each red underline shows its code in the Problems
# panel / on hover, so add any others here as needed.
[tool.pyrefly.errors]
bad-assignment = "warn"
bad-argument-type = "warn"
bad-return = "warn"
bad-specialization = "warn"
no-matching-overload = "warn"
