[project]
name = "custom-demo"
version = "0.1.0"
description = "Dashboard Agent — Deep Agent with dynamic dashboard visualizations"
readme = "README.md"
# Max Python the LangGraph deployment base image supports (3.14 can't deploy yet).
requires-python = ">=3.13"
dependencies = [
    # 0.7: the callable BackendFactory is gone; per-run backend selection is now a
    # concrete BackendProtocol that reads runtime context internally (get_runtime),
    # see agent.py DynamicBackend. 0.7 also makes TodoListMiddleware opt-in (we drop
    # our exclusion hack) and is required by langchain-quickjs>=0.3 (below).
    "deepagents>=0.7,<0.8",
    "langchain>=1.3.1",
    "langchain-core>=1.4.0",
    "langchain-anthropic>=1.4.3",
    # Azure OpenAI / OpenAI-compatible deployments (DASHBOARD_MODEL=azure_openai:<deployment>).
    "langchain-openai>=0.3",
    "langgraph>=1.2.1",
    # [sandbox] extra: the SandboxClient behind the agent's code-execution VM
    # (deepagents LangSmithSandbox backend).
    "langsmith[sandbox]>=0.10",
    # auth.py (loaded by the deployment) uses langgraph_sdk.Auth
    "langgraph-sdk>=0.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    # the /feedback route mounted on the deployment (http.app)
    "starlette>=0.37",
    # Dynamic subagents: the QuickJS code-interpreter (CodeInterpreterMiddleware).
    # 0.3.x requires deepagents>=0.7 and makes `task()`-from-code dispatches stream as
    # named, namespaced delegated subagents (the point of the 0.7 upgrade — so the SPA
    # panel can see eval-launched subagents). Gated by DA_DYNAMIC_SUBAGENTS (default
    # off); the native quickjs-rs dep ships cp313 wheels for the deploy image.
    "langchain-quickjs>=0.3,<0.4",
    # Real web search behind the `web_search` tool (tools/web_search.py). Without
    # TAVILY_API_KEY the tool returns an error rather than inventing results.
    "langchain-tavily>=0.2.18,<0.3",
]

[dependency-groups]
dev = [
    # Run the deployment locally (Agent Server) + create assistants
    "langgraph-cli[inmem]>=0.4",
    "pytest>=8.0",
    # LangSmith pytest plugin extras (rich) for `pytest --langsmith-output`
    "langsmith[pytest]>=0.10",
    # Lint/format + type-check
    "ruff>=0.14",
    "ty>=0.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dashboard_agent"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# pycodestyle(E/W), pyflakes(F), isort(I), pyupgrade(UP), bugbear(B),
# comprehensions(C4), pydocstyle(D — docstrings required + formatted).
select = ["E", "W", "F", "I", "UP", "B", "C4", "D"]
# Long lines are common in the prompt/data string literals; the formatter owns wrapping.
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
# Google style — picks the compatible D subset (no conflicting D203/D212/etc.).
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests: assert-heavy patterns + don't require docstrings on every test function.
"dashboard_agent/tests/*" = ["B011", "D100", "D101", "D102", "D103", "D104"]

[tool.ty.environment]
python-version = "3.13"


[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"

# Show type mismatches as warnings (yellow) instead of errors (red). Values:
# "error" | "warn" | "ignore". Each red underline shows its code in the Problems
# panel / on hover, so add any others here as needed.
[tool.pyrefly.errors]
bad-assignment = "warn"
bad-argument-type = "warn"
bad-return = "warn"
bad-specialization = "warn"
no-matching-overload = "warn"
