name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The exact build Vercel runs (tsc -b && vite build) — catches type errors
      # that `tsc --noEmit` misses in build mode.
      - run: npm run build

  backend:
    name: Backend (lint + type + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Installs deps + dev tools (ruff, ty, pytest) into .venv; uv provides Python 3.14.
      - run: uv sync
      - run: uv run ruff check dashboard_agent scripts evals
      - run: uv run ruff format --check dashboard_agent scripts evals
      - run: uv run ty check dashboard_agent scripts evals
      # Import smoke: catches broken imports (e.g. a removed tool still referenced).
      # graph.py eagerly builds the graph at import (build_graph -> require_anthropic_key),
      # so a placeholder key is needed. It is only constructed, never called — no API hit.
      - run: uv run python -c "import dashboard_agent.agent, dashboard_agent.graph, dashboard_agent.setup_graph"
        env:
          ANTHROPIC_API_KEY: sk-ci-placeholder-not-used
      # Unit tests only — the live agent/hallucination tests auto-skip without
      # ANTHROPIC_API_KEY (intentionally left unset here so no real API calls run).
      - run: uv run pytest dashboard_agent/tests -q

  # --- CD: deploy the agent to LangGraph on push to main (after CI passes) ---
  # The frontend is deployed separately by Vercel's GitHub integration; this job
  # only ships the LangGraph agent. .env is gitignored, so the deployment's runtime
  # secrets are reconstructed here from GitHub Actions secrets.
  deploy:
    name: Deploy agent (LangGraph)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    concurrency:
      group: deploy-agent
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync
      - name: Reconstruct deployment .env from secrets
        env:
          LS_CROSS_WORKSPACE_KEY: ${{ secrets.LS_CROSS_WORKSPACE_KEY }}
          BRANDFETCH_API_KEY: ${{ secrets.BRANDFETCH_API_KEY }}
          APP_SHARED_SECRET: ${{ secrets.APP_SHARED_SECRET }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_CUSTOM_HEADERS: ${{ secrets.ANTHROPIC_CUSTOM_HEADERS }}
        run: |
          {
            echo "LS_CROSS_WORKSPACE_KEY=$LS_CROSS_WORKSPACE_KEY"
            echo "BRANDFETCH_API_KEY=$BRANDFETCH_API_KEY"
            echo "APP_SHARED_SECRET=$APP_SHARED_SECRET"
            echo "ANTHROPIC_BASE_URL=$ANTHROPIC_BASE_URL"
            echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
            echo "ANTHROPIC_CUSTOM_HEADERS=$ANTHROPIC_CUSTOM_HEADERS"
          } > .env
      - name: langgraph deploy
        env:
          # Org-scoped key + tenant id target the Josiah Coad workspace's deployment.
          LANGSMITH_API_KEY: ${{ secrets.LS_CROSS_WORKSPACE_KEY }}
          LANGSMITH_TENANT_ID: 4582c584-4ea8-48aa-a5bc-ba36237b4735
        run: uv run langgraph deploy --deployment-id e746b603-8f54-4584-868f-0c47f2eac777 --deployment-type dev

  # --- Optional nightly live tests (uncomment + add ANTHROPIC_API_KEY secret) ---
  # Runs the real-LLM e2e + hallucination tests off the PR path (slow, costs
  # tokens, and the hallucination test is model-flaky). Schedule, not per-PR.
  #
  # live-tests:
  #   name: Live e2e (nightly)
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'schedule'
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: astral-sh/setup-uv@v5
  #       with:
  #         enable-cache: true
  #     - run: uv sync
  #     - run: uv run pytest dashboard_agent/tests/test_agent_e2e.py dashboard_agent/tests/test_hallucination_bug.py -q
  #       env:
  #         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  #         LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
  #
  # To enable the nightly schedule, also add at the top of `on:`:
  #   schedule:
  #     - cron: "17 7 * * *"
