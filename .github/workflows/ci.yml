name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The exact build Vercel runs (tsc -b && vite build) — catches type errors
      # that `tsc --noEmit` misses in build mode.
      - run: npm run build
      # The plain-node tests in custom_demo/tests/*.js, which import the real
      # frontend modules via Node's native type stripping. They were in no job at
      # all, so voice_test.js sat red for days after the tool it asserted on was
      # deleted. Run from the repo root because that is where their imports resolve.
      - name: Node module tests
        working-directory: .
        run: for f in custom_demo/tests/*.js; do echo "== $f"; node "$f" || exit 1; done

  backend:
    name: Backend (lint + type + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # The Python the DEPLOYMENT runs (langgraph.json python_version, and the
          # ceiling in requires-python). setup-uv exports it as UV_PYTHON, so every
          # `uv` step below uses it. Without the pin CI ran 3.14 while production ran
          # 3.13, so 3.14-only behaviour passed here and broke the deploy build - e.g.
          # dropping a `from __future__ import annotations` is free on 3.14 (PEP 649)
          # and breaks unquoted forward references on 3.13.
          python-version: "3.13"
      # Installs deps + dev tools (ruff, ty, pytest) into .venv on that interpreter.
      - run: uv sync --locked
      - run: uv run ruff check custom_demo scripts evals mcp_demo_server
      - run: uv run ruff format --check custom_demo scripts evals mcp_demo_server
      # House rule ruff has no equivalent for: after an indented block ends, the next
      # statement at the same indentation needs a blank line in front of it. E301/E302/E303
      # only cover methods and top-level defs, so this is its own checker - the Python
      # counterpart of frontend/scripts/check-no-emdash.mjs. `ruff format` preserves the
      # blank lines it asks for, so the two never fight; `--fix` inserts them.
      - run: uv run python scripts/check_blank_after_block.py
      - run: uv run ty check custom_demo scripts evals mcp_demo_server
      # Import smoke: catches broken imports (e.g. a removed tool still referenced).
      # These four are the entrypoints langgraph.json names, so importing them
      # reaches the whole package. Named by ENTRYPOINT rather than by internal
      # module, which is what broke when the package was split into subfolders.
      # graph.py eagerly builds the graph at import (build_agent -> require_model_key),
      # so a placeholder key is needed. It is only constructed, never called — no API hit.
      - run: uv run python -c "import custom_demo.auth, custom_demo.graph, custom_demo.setup_graph, custom_demo.webapp"
        env:
          ANTHROPIC_API_KEY: sk-ci-placeholder-not-used
      # Unit tests only — the live agent/hallucination tests auto-skip without
      # ANTHROPIC_API_KEY (intentionally left unset here so no real API calls run).
      - run: uv run pytest custom_demo/tests evals -q

  # --- CD ---
  # There is no deploy job here on purpose. The LangSmith deployment is connected to this
  # repository through the GitHub integration with `build_on_push: true`, so a push to main
  # builds and deploys itself - and its secrets live on the deployment rather than being
  # reconstructed from GitHub Actions secrets into a .env at build time.
  #
  # That also buys preview deployments per pull request, which the CLI path could not do. The
  # job this replaced ran `langgraph deploy --deployment-id ...` against a specific deployment;
  # keeping both would race two deploys on every merge, and the pinned id becomes a broken
  # build the moment that deployment is deleted.
  #
  # The frontend is still deployed separately by Vercel's GitHub integration, and points at
  # the Agent Server through VITE_LG_URL in the Vercel project's environment.

  # --- Optional nightly live tests (uncomment + add ANTHROPIC_API_KEY secret) ---
  # Runs the real-LLM hallucination test off the PR path: slow, costs tokens, and
  # model-flaky by nature. Schedule, not per-PR.
  #
  # It needs BOTH a key and a sandbox. `conftest.py` forces SANDBOX_ENABLED=0 for the whole
  # suite, so this job must point at the file directly and set SANDBOX_ENABLED=1, or the test
  # skips itself and the job passes having asserted nothing.
  #
  # live-tests:
  #   name: Live e2e (nightly)
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'schedule'
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: astral-sh/setup-uv@v5
  #       with:
  #         enable-cache: true
  #         python-version: "3.13"
  #     - run: uv sync --locked
  #     - run: uv run pytest custom_demo/tests/test_hallucination_bug.py -q -rs
  #       env:
  #         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  #         LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
  #         SANDBOX_ENABLED: "1"
  #
  # To enable the nightly schedule, also add at the top of `on:`:
  #   schedule:
  #     - cron: "17 7 * * *"
