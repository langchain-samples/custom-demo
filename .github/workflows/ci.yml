name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The exact build Vercel runs (tsc -b && vite build) — catches type errors
      # that `tsc --noEmit` misses in build mode.
      - run: npm run build

  backend:
    name: Backend (import + unit tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Import smoke: catches broken imports (e.g. a removed tool still referenced).
      - run: python -c "import dashboard_agent.agent, dashboard_agent.graph, dashboard_agent.setup_graph"
      # Unit tests only — the live agent/hallucination tests auto-skip without
      # ANTHROPIC_API_KEY (which is intentionally not set here).
      - run: pytest dashboard_agent/tests -q

  # --- Optional nightly live tests (uncomment + add ANTHROPIC_API_KEY secret) ---
  # Runs the real-LLM e2e + hallucination tests off the PR path (slow, costs
  # tokens, and the hallucination test is model-flaky). Schedule, not per-PR.
