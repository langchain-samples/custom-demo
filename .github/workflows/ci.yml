  #       with:
  #         python-version: "3.12"
  #         cache: pip
  #     - run: pip install -r requirements.txt
  #     - run: pytest dashboard_agent/tests/test_agent_e2e.py dashboard_agent/tests/test_hallucination_bug.py -q
