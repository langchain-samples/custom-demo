<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard Agent — Live Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --brand-blue: #3b82f6;      /* accent (gear-configurable) */
      --brand-blue-dark: #2f6ad0;
      --bg: #0a0a0b;
      --panel: #0f0f11;
      --panel-2: #141417;
      --sidebar: #0c0c0e;
      --border: #222226;
      --text: #ececee;
      --muted: #8a8a93;
      --rail: 420px;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text); background: var(--bg); height: 100vh; overflow: hidden;
      display: flex; flex-direction: row;
    }
    /* Threads sidebar */
    .sidebar { width: 256px; flex: 0 0 auto; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
    .sb-brand { display: flex; align-items: center; gap: 9px; padding: 14px 16px; font-weight: 700; font-size: 15px; }
    .sb-brand .logo { font-size: 20px; }
    .sb-brand .logo img { height: 22px; width: 22px; object-fit: contain; border-radius: 5px; display: block; }
    .sb-new { margin: 4px 12px 10px; padding: 9px 12px; text-align: left; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .sb-new:hover { border-color: var(--brand-blue); }
    .sb-label { padding: 6px 16px; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    #thread-list { flex: 1 1 auto; overflow-y: auto; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 2px; }
    .thread { text-align: left; padding: 8px 10px; border: none; background: none; color: var(--text); border-radius: 8px; cursor: pointer; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .thread:hover { background: var(--panel-2); }
    .thread.active { background: var(--panel-2); color: #fff; }
    .sb-foot { padding: 10px 16px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--border); }
    .main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    header {
      background: var(--panel); color: var(--text); padding: 11px 18px; display: flex; align-items: center; gap: 12px; flex: 0 0 auto; border-bottom: 1px solid var(--border);
    }
    header .logo { font-size: 20px; }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    .feedback { align-self: flex-start; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: -4px; }
    .fb-q { margin-right: 2px; }
    .fb-btn { background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 3px 8px; cursor: pointer; font-size: 14px; }
    .fb-btn:hover { border-color: var(--brand-blue); }
    .fb-btn.sel { border-color: var(--brand-blue); background: rgba(59,130,246,.15); }
    .fb-comment { display: none; gap: 6px; width: 100%; margin-top: 6px; }
    .fb-comment.show { display: flex; }
    .fb-input { flex: 1; padding: 6px 9px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; background: var(--panel-2); color: var(--text); }
    .fb-send { background: var(--brand-blue); color: #fff; border: none; border-radius: 8px; padding: 0 12px; cursor: pointer; font-size: 13px; }
    .fb-send:disabled { opacity: .5; cursor: default; }
    .fb-status { font-size: 12px; }
    .fb-status.ok { color: #4ade80; }
    .fb-status.err { color: #f87171; }
    .canvas-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
    #export-pdf {
      background: transparent; color: var(--brand-blue); border: 1px solid var(--brand-blue);
      border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    #export-pdf:hover:not(:disabled) { background: rgba(59,130,246,.12); }
    #export-pdf:disabled { color: var(--muted); border-color: var(--border); cursor: default; }

    /* Layout: single centered column on load; two columns once a dashboard exists. */
    .app {
      display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr; flex: 1 1 auto; min-height: 0;
      transition: grid-template-columns .5s ease;
    }
    .app.has-dashboard { grid-template-columns: var(--rail) 1fr; }

    /* Chat */
    .chat { display: flex; flex-direction: column; background: var(--panel); min-height: 0; width: 100%; }
    .app:not(.has-dashboard) .chat { max-width: 760px; margin: 0 auto; box-shadow: 0 0 0 1px var(--border); }
    .app.has-dashboard .chat { border-right: 1px solid var(--border); }
    #chat-log { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
    /* Bottom-anchor messages (hug the input); collapses to normal scroll when full. */
    #chat-log > :first-child { margin-top: auto; }
    .msg { padding: 10px 13px; border-radius: 12px; font-size: 14px; line-height: 1.5; max-width: 92%; }
    .msg-user { background: var(--brand-blue); color: #fff; align-self: flex-end; border-bottom-right-radius: 3px; }
    .msg-assistant { background: var(--panel-2); color: var(--text); align-self: flex-start; border-bottom-left-radius: 3px; }
    .msg-assistant p { margin: 4px 0; }
    .msg-assistant ul { margin: 6px 0; padding-left: 18px; }
    .activity { display: flex; flex-direction: column; gap: 6px; align-self: flex-start; max-width: 96%; }
    .tool-chip { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 5px 9px; animation: pop .25s ease; }
    .tc-head { display: flex; align-items: center; gap: 7px; }
    .tc-head.clickable { cursor: pointer; }
    .tc-head.clickable:hover { color: var(--brand-blue); }
    .tc-icon { font-size: 13px; }
    .tc-label { font-weight: 600; white-space: nowrap; }
    .tc-arg { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); background: var(--bg); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tc-caret { margin-left: auto; font-size: 10px; }
    .tc-details { margin: 0; font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--text); background: #000; border: 1px solid var(--border); border-radius: 6px; padding: 8px; max-height: 240px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
    .cursor::after { content: "▌"; animation: blink 1s steps(2) infinite; color: var(--muted); }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    .presets { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
    .presets .label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .preset { text-align: left; font-size: 12.5px; padding: 8px 10px; border: 1px solid var(--border); background: var(--panel-2); border-radius: 8px; cursor: pointer; color: var(--text); }
    .preset:hover { border-color: var(--brand-blue); background: rgba(59,130,246,.12); }
    .preset b { color: var(--brand-blue); }
    #chat-form { display: flex; padding: 12px 14px; gap: 8px; border-top: 1px solid var(--border); }
    #chat-input { flex: 1; padding: 11px 13px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background: var(--panel-2); color: var(--text); }
    #chat-form button { background: var(--brand-blue); color: #fff; border: none; border-radius: 10px; padding: 0 18px; font-size: 14px; cursor: pointer; }
    #chat-form button:hover { background: var(--brand-blue-dark); }

    /* Dashboard canvas (hidden until a widget arrives) */
    .canvas-wrap { overflow-y: auto; min-height: 0; padding: 20px 24px; opacity: 0; transform: translateX(24px); transition: opacity .5s ease, transform .5s ease; }
    .app.has-dashboard .canvas-wrap { opacity: 1; transform: none; }
    .canvas-title { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0; }
    .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 16px; }
    .widget-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
    .widget { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.04); animation: pop .35s ease; }
    @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .span-2 { grid-column: span 2; }
    .widget-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
    .chart-wrap { position: relative; height: 260px; }
    .kpi-card { display: flex; flex-direction: column; gap: 4px; }
    .kpi-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
    .kpi-value { font-size: 30px; font-weight: 700; color: var(--brand-blue); line-height: 1.1; }
    .kpi-unit { font-size: 14px; color: var(--muted); font-weight: 500; }
    .kpi-delta { font-size: 13px; font-weight: 600; }
    .kpi-desc { font-size: 12px; color: var(--muted); }
    .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .data-table th, .data-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .data-table th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .03em; }
    .text-body { font-size: 13.5px; line-height: 1.55; }
    .text-body ul { padding-left: 18px; margin: 6px 0; }

    /* Config gear + settings panel */
    #preset-list { display: flex; flex-direction: column; gap: 6px; }
    #settings-gear { margin-left: auto; }
    .icon-btn { background: rgba(255,255,255,.16); color: #fff; border: none; width: 30px; height: 30px; border-radius: 8px; cursor: pointer; font-size: 15px; line-height: 1; display: inline-flex; align-items: center; justify-content: center; }
    .icon-btn:hover { background: rgba(255,255,255,.30); }
    header .logo img { height: 24px; width: 24px; object-fit: contain; border-radius: 5px; display: block; }
    #settings-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.35); display: flex; justify-content: flex-end; z-index: 50; }
    #settings-overlay.hidden { display: none; }
    #settings-panel { width: 360px; max-width: 90vw; height: 100%; background: var(--panel); box-shadow: -4px 0 24px rgba(0,0,0,.15); padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .sp-head { display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 700; }
    #sp-close { background: none; border: none; font-size: 16px; cursor: pointer; color: var(--muted); }
    #settings-panel > label { display: flex; flex-direction: column; gap: 5px; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
    #settings-panel input[type=text] { padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; color: var(--text); background: var(--panel-2); font-weight: 400; text-transform: none; letter-spacing: 0; }
    .sp-color { display: flex; gap: 8px; align-items: center; }
    .sp-color input[type=color] { width: 42px; height: 34px; padding: 0; border: 1px solid var(--border); border-radius: 8px; background: none; cursor: pointer; }
    .sp-color input[type=text] { flex: 1; }
    .sp-actions-head { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); border-top: 1px solid var(--border); padding-top: 12px; }
    #sp-actions { display: flex; flex-direction: column; gap: 10px; }
    .sp-action { display: flex; flex-direction: column; gap: 5px; border: 1px solid var(--border); border-radius: 10px; padding: 9px 9px 9px; position: relative; }
    .sp-action input { width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 12.5px; background: var(--panel-2); color: var(--text); }
    .sp-del { position: absolute; top: 7px; right: 7px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; }
    .sp-btn { background: var(--brand-blue); color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; }
    .sp-btn.ghost { background: transparent; color: var(--brand-blue); border: 1px solid var(--brand-blue); }
    .sp-foot { margin-top: auto; display: flex; gap: 8px; padding-top: 4px; }

    @media print {
      header, .chat, .canvas-head { display: none !important; }
      .app, .app.has-dashboard { display: block; height: auto; }
      .canvas-wrap { overflow: visible; opacity: 1; transform: none; }
      .widget { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><span class="logo" id="sb-logo">🌐</span><span id="sb-name">Dashboard Agent</span></div>
    <button class="sb-new" id="new-chat">✏️  New chat</button>
    <div class="sb-label">Recent</div>
    <div id="thread-list"></div>
    <div class="sb-foot">Conversations run on your LangGraph deployment.</div>
  </aside>
  <div class="main">
    <header>
      <span class="logo" id="brand-logo">🌐</span>
      <h1 id="brand-name">Dashboard Agent — Humanitarian Insights</h1>
      <button id="settings-gear" class="icon-btn" title="Customize appearance" aria-label="Settings">⚙️</button>
    </header>
    <div class="app" id="app">
    <section class="chat">
      <div id="chat-log"></div>
      <div class="presets">
        <div class="label">Try a persona question</div>
        <div id="preset-list"></div>
      </div>
      <form id="chat-form">
        <input id="chat-input" placeholder="Ask a question…" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </section>
    <section class="canvas-wrap">
      <div class="canvas-head">
        <p class="canvas-title">Live dashboard</p>
        <button id="export-pdf" title="Download the dashboard as a PDF" disabled>⬇ Download PDF</button>
      </div>
      <div id="dashboard"></div>
    </section>
    </div>
  </div>

  <div id="settings-overlay" class="hidden">
    <div id="settings-panel">
      <div class="sp-head"><span>Customize</span><button id="sp-close" aria-label="Close">✕</button></div>
      <label>Name<input id="sp-name" type="text" placeholder="Dashboard Agent" /></label>
      <label>Accent color
        <span class="sp-color"><input id="sp-accent" type="color" /><input id="sp-accent-text" type="text" placeholder="#0072BC" /></span>
      </label>
      <label>Logo (emoji or image URL)<input id="sp-logo" type="text" placeholder="🌐 or https://…/logo.png" /></label>
      <label>Deployment URL<input id="sp-lgurl" type="text" placeholder="http://127.0.0.1:2024" /></label>
      <label>Assistant (id or graph name)<input id="sp-assistant" type="text" placeholder="dashboard_agent" /></label>
      <div class="sp-actions-head"><span>Quick actions</span><button id="sp-add" class="sp-btn ghost" type="button">＋ Add</button></div>
      <div id="sp-actions"></div>
      <div class="sp-foot"><button id="sp-reset" class="sp-btn ghost" type="button">Reset to defaults</button></div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js?v=18"></script>
</body>
</html>
