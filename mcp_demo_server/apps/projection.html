<style>
  .control { margin-bottom: 9px; }
  .control .head { display: flex; align-items: baseline; gap: 6px; }
  .control .head b { margin-left: auto; font-variant-numeric: tabular-nums; font-size: 12.5px; }
  #chart { display: block; width: 100%; height: 170px; }
  .legend { display: flex; gap: 12px; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
  .verdict { font-size: 12.5px; margin-top: 8px; }
  .verdict b { font-size: 15px; font-variant-numeric: tabular-nums; }
  .good { color: var(--up); }
  .bad { color: var(--down); }
</style>

<p class="msg" id="msg">Model the goal.</p>

<div class="control">
  <div class="head"><span class="lbl">Retirement age</span><b id="age-v">65</b></div>
  <input type="range" id="age" min="55" max="75" step="1" value="65" aria-label="Retirement age" />
</div>
<div class="control">
  <div class="head"><span class="lbl">Monthly contribution</span><b id="cont-v">$2,000</b></div>
  <input type="range" id="cont" min="0" max="10000" step="250" value="2000" aria-label="Monthly contribution" />
</div>
<div class="control">
  <div class="head"><span class="lbl">Risk</span><b id="risk-v">Balanced</b></div>
  <input type="range" id="risk" min="0" max="4" step="1" value="2" aria-label="Risk level" />
</div>

<div class="card">
  <canvas id="chart" aria-label="Projected balance range"></canvas>
  <div class="legend">
    <span><i class="swatch" style="background: var(--accent); opacity: 0.18"></i>10th to 90th percentile</span>
    <span><i class="swatch" style="background: var(--accent)"></i>Median</span>
    <span><i class="swatch" style="background: var(--muted)"></i>Goal</span>
  </div>
</div>

<div class="verdict">
  Median at retirement <b id="median">$0</b>
  <span id="odds" class="muted"></span>
</div>

<div class="row">
  <button type="button" class="primary" id="submit">Save this plan</button>
  <button type="button" id="cancel">Cancel</button>
</div>

<script>
  (function () {
    "use strict";

    // Five risk postures: expected real return and volatility. Kept in the app
    // because the whole point is that the chart redraws as you drag, and a round
    // trip to the server per pixel would make it feel dead.
    var RISK = [
      { name: "Preservation", mu: 0.030, sd: 0.045 },
      { name: "Conservative", mu: 0.043, sd: 0.070 },
      { name: "Balanced",     mu: 0.055, sd: 0.105 },
      { name: "Growth",       mu: 0.065, sd: 0.140 },
      { name: "Aggressive",   mu: 0.072, sd: 0.175 },
    ];

    var state = { currentAge: 45, balance: 250000, goal: 2000000, currency: "$" };
    var els = {
      age: document.getElementById("age"),
      cont: document.getElementById("cont"),
      risk: document.getElementById("risk"),
      chart: document.getElementById("chart"),
    };

    var money = function (n) {
      if (n >= 1e6) return state.currency + (n / 1e6).toFixed(2) + "M";
      if (n >= 1e3) return state.currency + Math.round(n / 1e3) + "k";
      return state.currency + Math.round(n);
    };

    /**
     * Percentile paths for the balance, year by year.
     *
     * Closed-form lognormal rather than sampled Monte Carlo: the median and the
     * 10th/90th band are what the chart shows, and those have exact expressions
     * under the same assumptions a simulation would make. Thousands of sampled
     * paths per slider tick would drop frames for a fuzzier version of the same
     * curve.
     */
    function project(years, monthly, mu, sd) {
      var out = [];
      // Standard normal quantiles for the 10th and 90th percentiles.
      var Z = 1.2815515655446004;
      for (var t = 0; t <= years; t++) {
        // Contributions compound too, so grow each year's inflow for the years
        // it remains invested.
        var contributed = 0;
        for (var y = 0; y < t; y++) contributed += monthly * 12 * Math.pow(1 + mu, t - y - 0.5);
        var grown = state.balance * Math.pow(1 + mu, t);
        var mid = grown + contributed;
        // Spread applies to the invested balance, widening with the square root
        // of time, as volatility does.
        var spread = sd * Math.sqrt(t);
        out.push({
          t: t,
          lo: mid * Math.exp(-Z * spread - 0.5 * spread * spread),
          mid: mid * Math.exp(-0.5 * spread * spread),
          hi: mid * Math.exp(Z * spread - 0.5 * spread * spread),
        });
      }
      return out;
    }

    function draw(path) {
      var c = els.chart;
      var ratio = window.devicePixelRatio || 1;
      var rect = c.getBoundingClientRect();
      if (!rect.width) return;
      c.width = Math.round(rect.width * ratio);
      c.height = Math.round(rect.height * ratio);
      var ctx = c.getContext("2d");
      if (!ctx) return;
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      var w = rect.width;
      var h = rect.height;
      ctx.clearRect(0, 0, w, h);

      var style = getComputedStyle(document.documentElement);
      var accent = style.getPropertyValue("--accent").trim() || "#2f6feb";
      var muted = style.getPropertyValue("--muted").trim() || "#6b7280";

      var top = Math.max(state.goal * 1.15, path[path.length - 1].hi);
      var x = function (t) { return (t / (path.length - 1)) * (w - 6) + 3; };
      var y = function (v) { return h - 14 - (v / top) * (h - 22); };

      // The band first, so the median and the goal line sit on top of it.
      ctx.beginPath();
      path.forEach(function (p, i) { i ? ctx.lineTo(x(p.t), y(p.hi)) : ctx.moveTo(x(p.t), y(p.hi)); });
      for (var i = path.length - 1; i >= 0; i--) ctx.lineTo(x(path[i].t), y(path[i].lo));
      ctx.closePath();
      ctx.globalAlpha = 0.18;
      ctx.fillStyle = accent;
      ctx.fill();
      ctx.globalAlpha = 1;

      ctx.beginPath();
      ctx.setLineDash([4, 4]);
      ctx.moveTo(3, y(state.goal));
      ctx.lineTo(w - 3, y(state.goal));
      ctx.strokeStyle = muted;
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.beginPath();
      path.forEach(function (p, i) { i ? ctx.lineTo(x(p.t), y(p.mid)) : ctx.moveTo(x(p.t), y(p.mid)); });
      ctx.strokeStyle = accent;
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = muted;
      ctx.font = "10px ui-sans-serif, system-ui, sans-serif";
      ctx.fillText("now", 3, h - 3);
      ctx.fillText("age " + els.age.value, w - 46, h - 3);
      ctx.fillText("goal " + money(state.goal), 6, Math.max(9, y(state.goal) - 3));
    }

    function render() {
      var age = Number(els.age.value);
      var monthly = Number(els.cont.value);
      var risk = RISK[Number(els.risk.value)];
      var years = Math.max(1, age - state.currentAge);

      document.getElementById("age-v").textContent = String(age);
      document.getElementById("cont-v").textContent = state.currency + monthly.toLocaleString();
      document.getElementById("risk-v").textContent = risk.name;

      var path = project(years, monthly, risk.mu, risk.sd);
      draw(path);

      var end = path[path.length - 1];
      document.getElementById("median").textContent = money(end.mid);
      // Where the goal falls in the terminal lognormal, read back as a
      // probability of clearing it.
      var spread = risk.sd * Math.sqrt(years) || 1e-9;
      var z = (Math.log(end.mid / state.goal) + 0.5 * spread * spread) / spread;
      var odds = Math.round(100 * (1 - normalCdf(-z)));
      var el = document.getElementById("odds");
      el.textContent = " - " + odds + "% chance of reaching " + money(state.goal);
      el.className = odds >= 70 ? "good" : odds >= 45 ? "muted" : "bad";
      McpApp.resize();
    }

    /** Abramowitz and Stegun 26.2.17: enough precision for a projection band. */
    function normalCdf(z) {
      var t = 1 / (1 + 0.2316419 * Math.abs(z));
      var d = 0.3989422804014327 * Math.exp((-z * z) / 2);
      var p = d * t * (0.319381530 + t * (-0.356563782 + t * (1.781477937 + t * (-1.821255978 + t * 1.330274429))));
      return z > 0 ? 1 - p : p;
    }

    ["age", "cont", "risk"].forEach(function (id) {
      document.getElementById(id).addEventListener("input", render);
    });
    window.addEventListener("resize", render);

    document.getElementById("cancel").addEventListener("click", McpApp.cancel);

    document.getElementById("submit").addEventListener("click", function () {
      McpApp.submit({
        retirement_age: Number(els.age.value),
        monthly_contribution: Number(els.cont.value),
        risk_level: RISK[Number(els.risk.value)].name,
      });
    });

    McpApp.onInit(function (request) {
      if (request.message) document.getElementById("msg").textContent = request.message;
      // On a property, not the schema root: the SDK drops unknown root keys.
      var schema = request.requested_schema || {};
      var ctx = ((schema.properties || {}).retirement_age || {})["x-app"] || {};
      state.currentAge = Number(ctx.current_age || state.currentAge);
      state.balance = Number(ctx.balance || state.balance);
      state.goal = Number(ctx.goal || state.goal);
      els.age.min = String(state.currentAge + 1);
      els.age.value = String(Math.max(state.currentAge + 1, Number(ctx.default_age || 65)));
      render();
    });

    render();
    McpApp.ready();
  })();
</script>
